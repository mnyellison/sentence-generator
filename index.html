<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Frases & Citações</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components/theme-toggle.css" />
    <link rel="stylesheet" href="css/components/banner.css" />
    <link rel="stylesheet" href="css/components/quote-card.css" />
    <link rel="stylesheet" href="css/components/buttons.css" />
    <script
      src="https://kit.fontawesome.com/a16984c516.js"
      crossorigin="anonymous"
    ></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <button
      class="theme-toggle"
      id="themeToggle"
      type="button"
      aria-label="Alternar tema claro e escuro"
      title="Alternar tema"
    >
      <i class="fa-solid fa-sun"></i>
      <i class="fa-solid fa-moon"></i>
    </button>

    <main class="page">
      <header class="page__header">
        <div class="page__icon" aria-hidden="true">
          <i class="fa-solid fa-quote-left"></i>
        </div>
        <h1 class="page__title">Gerador de Frases &amp; Citações</h1>
        <p class="page__subtitle">
          Uma pequena coleção para inspirar, guardar e revisitar.
        </p>
      </header>

      <div class="banner" id="banner" role="status" hidden>
        <span class="banner__icon" aria-hidden="true">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </span>
        <span class="banner__text" id="bannerText">
          <!-- Mensagem de erro será exibida dinamicamente via JS -->
        </span>
      </div>

      <section class="quote-card" id="quoteCard" aria-live="polite">
        <div class="quote-card__icon" aria-hidden="true">❝</div>
        <div class="quote-card__body">
          <p class="quote-card__text" id="quoteText">
            Clique em "Gerar nova frase" para começar.
          </p>
          <p class="quote-card__author" id="quoteAuthor">&nbsp;</p>
          <div class="quote-card__tag" id="quoteTag" hidden></div>
        </div>
      </section>

      <button class="button button--primary" id="generateBtn" type="button">
        Gerar nova frase
      </button>
    </main>
  </body>
</html>
